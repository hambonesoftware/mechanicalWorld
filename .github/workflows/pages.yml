name: Publish Mechanical World
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Install headless Chromium
        run: npx playwright install chromium --only-shell
      - name: Check responsive gameplay before publishing
        run: npm run test:e2e
      - name: Archive visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanical-world-mobile-visual-qa
          path: test-results/*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
